<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nature Image Gallery</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header><h1>Nature Gallery</h1><p>A little collection of beautiful places</p></header>
  <main>
    <div class="filters" aria-label="Filter images">
      <button class="active" data-filter="all">All</button>
      <button data-filter="mountains">Mountains</button>
      <button data-filter="ocean">Ocean</button>
      <button data-filter="forest">Forest</button>
    </div>
    <section class="gallery" id="gallery">
      <button class="photo" data-category="mountains" data-title="Mountain Peaks"><img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=900&q=80" alt="Snow-covered mountain peaks"><span>Mountain Peaks</span></button>
      <button class="photo" data-category="ocean" data-title="Blue Ocean"><img src="https://images.unsplash.com/photo-1500375592092-40eb2168fd21?auto=format&fit=crop&w=900&q=80" alt="Blue ocean waves"><span>Blue Ocean</span></button>
      <button class="photo" data-category="forest" data-title="Green Forest"><img src="https://images.unsplash.com/photo-1448375240586-882707db888b?auto=format&fit=crop&w=900&q=80" alt="Sunlight in a green forest"><span>Green Forest</span></button>
      <button class="photo" data-category="mountains" data-title="Mountain Lake"><img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=900&q=80" alt="Lake surrounded by mountains"><span>Mountain Lake</span></button>
      <button class="photo" data-category="ocean" data-title="Tropical Coast"><img src="https://images.unsplash.com/photo-1519046904884-53103b34b206?auto=format&fit=crop&w=900&q=80" alt="Tropical coast and sea"><span>Tropical Coast</span></button>
      <button class="photo" data-category="forest" data-title="Forest Path"><img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=900&q=80" alt="Path through a forest"><span>Forest Path</span></button>
    </section>
  </main>
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Image viewer">
    <button class="close" id="close" aria-label="Close image">×</button>
    <button class="arrow" id="prev" aria-label="Previous image">‹</button>
    <figure><img id="largeImage" alt=""><figcaption id="caption"></figcaption></figure>
    <button class="arrow" id="next" aria-label="Next image">›</button>
  </div>
  <footer>Made with HTML, CSS and JavaScript</footer>
  <script src="script.js"></script>
</body>
</html>
